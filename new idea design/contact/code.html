<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Delta Labs - Contact</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#0647f9",
          "background-light": "#f5f6f8",
          "background-dark": "#0f1423",
          "surface": "#ffffff",
          "text-main": "#111111",
          "muted": "#888888",
          "error": "#FF3333"
        },
        fontFamily: {
          "display": ["Syne", "sans-serif"],
          "body": ["Syne", "sans-serif"]
        },
        borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem", "sm": "0.125rem"},
      },
    },
  }
</script>
<style>
  body {
    font-family: 'Syne', sans-serif;
  }
  
  /* Input focus transition */
  .minimal-input {
    transition: border-width 0.2s ease, border-color 0.2s ease;
  }
  
  .minimal-input:focus {
    outline: none;
    border-bottom-width: 4px;
    border-color: #0647f9;
  }
  
  /* Button transition */
  .submit-btn {
    transition: background-color 0.3s ease;
  }
  
  .submit-btn:hover {
    background-color: #111111;
  }
  
  /* Loading animation */
  @keyframes pulse-opacity {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .loading-pulse {
    animation: pulse-opacity 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }
</style>
</head>
<body class="bg-background-light text-text-main h-screen w-full overflow-hidden flex flex-col md:flex-row">
<!-- Mobile/Tablet Top Nav (Back to main exception) -->
<header class="md:hidden flex items-center justify-between px-6 py-4 bg-[#111111] text-white border-b border-[#333]">
<a class="flex items-center gap-2 text-white hover:text-muted transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
<span class="text-sm font-semibold uppercase tracking-widest">Back</span>
</a>
<h1 class="text-lg font-bold tracking-tight">Delta Labs</h1>
</header>
<!-- Left Panel: Dark Informational -->
<div class="w-full md:w-1/2 h-[409px] md:h-full bg-[#111111] text-white flex flex-col justify-center items-center relative overflow-hidden">
<!-- Background Texture/Image -->
<div class="absolute inset-0 bg-cover bg-center opacity-20 mix-blend-overlay pointer-events-none" data-alt="Abstract dark minimalist architectural background with sharp angles, deep shadows, and subtle highlights, monochromatic high-contrast aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCYu1Wfe-rpkOTpRXPsIjUmGDlY6LOKHVT2uECp7EDC7FNH4ORMAbn7-r2bxsWek_G3dh_h7pIzTbXMXKz8A-5BOxtTp2A8UpFiEfUjvIxlRV-yLx-Yr5gJoFxi13SM8pwPQBN9u23rGXEEkpwaVfl2Pb3Hr9ACszOw6zpu2ZUcRd-Y2iu0a2kzA1urcu4YBNIFTwJ00zDK4PFwvyP3RGJBiGJwTAcleyZ19YVG4y-28PM8jaH1sAiF')"></div>
<div class="relative z-10 p-8 md:p-16 flex flex-col items-center justify-center h-full text-center">
<p class="text-sm md:text-base text-muted uppercase tracking-[0.2em] mb-6 md:mb-12">Let's Build Something</p>
<!-- Oversized Email Link -->
<a class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold tracking-tight border-b-2 border-white hover:text-primary hover:border-primary transition-colors duration-300 break-all px-2" href="mailto:hello@deltalabs.tech">
        hello@deltalabs.tech
      </a>
<!-- Desktop Back Button (Absolute positioning within left panel) -->
<a class="hidden md:flex absolute top-10 left-10 items-center gap-2 text-white/70 hover:text-white transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
<span class="text-sm font-semibold uppercase tracking-widest">Return</span>
</a>
</div>
</div>
<!-- Right Panel: Light Form -->
<div class="w-full md:w-1/2 h-[614px] md:h-full bg-surface flex flex-col justify-center items-center relative overflow-y-auto md:overflow-hidden">
<div class="w-full max-w-xl p-8 md:p-16 lg:p-24 flex flex-col">
<h2 class="text-2xl md:text-3xl font-bold mb-10 tracking-tight hidden md:block">Inquiry</h2>
<form class="flex flex-col gap-8 md:gap-12 w-full" id="contactForm">
<!-- Name Input -->
<div class="relative flex flex-col group">
<label class="text-xs font-semibold text-muted uppercase tracking-widest mb-2" for="name">Full Name</label>
<input class="minimal-input w-full bg-transparent border-0 border-b-2 border-text-main text-xl md:text-2xl py-3 px-0 focus:ring-0 placeholder:text-muted/30" id="name" name="name" placeholder="John Doe" required="" type="text"/>
<span class="error-msg text-error text-xs font-medium mt-2 hidden opacity-0 transition-opacity">Please provide your name.</span>
</div>
<!-- Email Input (Shows Error State Example via JS class toggle) -->
<div class="relative flex flex-col group" id="emailGroup">
<label class="text-xs font-semibold text-muted uppercase tracking-widest mb-2" for="email">Email Address</label>
<input class="minimal-input w-full bg-transparent border-0 border-b-2 border-text-main text-xl md:text-2xl py-3 px-0 focus:ring-0 placeholder:text-muted/30" id="email" name="email" placeholder="john@example.com" required="" type="email"/>
<span class="error-msg text-error text-xs font-medium mt-2 hidden opacity-0 transition-opacity" id="emailError">Valid email is required.</span>
</div>
<!-- Message Input -->
<div class="relative flex flex-col group">
<label class="text-xs font-semibold text-muted uppercase tracking-widest mb-2" for="message">Project Details</label>
<textarea class="minimal-input w-full bg-transparent border-0 border-b-2 border-text-main text-xl md:text-2xl py-3 px-0 focus:ring-0 placeholder:text-muted/30 resize-none" id="message" name="message" placeholder="Tell us about what you want to build..." required="" rows="3"></textarea>
<span class="error-msg text-error text-xs font-medium mt-2 hidden opacity-0 transition-opacity">Please provide project details.</span>
</div>
<!-- Submit Button -->
<div class="mt-4">
<button class="submit-btn w-full h-[72px] md:h-[80px] bg-primary text-white text-sm md:text-base font-bold uppercase tracking-[0.15em] rounded-sm flex items-center justify-center gap-3" id="submitBtn" type="submit">
<span id="btnText">Submit Inquiry</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('contactForm');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnIcon = submitBtn.querySelector('.material-symbols-outlined');
      const emailInput = document.getElementById('email');
      const emailGroup = document.getElementById('emailGroup');
      const emailError = document.getElementById('emailError');

      // Simple validation mock
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        let isValid = true;
        
        // Mock error state for demonstration if email is empty
        if(!emailInput.value || !emailInput.value.includes('@')) {
          emailInput.style.borderColor = '#FF3333';
          emailError.classList.remove('hidden');
          setTimeout(() => emailError.classList.remove('opacity-0'), 10);
          isValid = false;
        } else {
          emailInput.style.borderColor = '';
          emailError.classList.add('opacity-0');
          setTimeout(() => emailError.classList.add('hidden'), 300);
        }

        if(isValid) {
          // Loading state
          submitBtn.classList.add('loading-pulse');
          submitBtn.style.pointerEvents = 'none';
          btnText.textContent = 'Sending...';
          btnIcon.classList.add('hidden');

          // Reset after mock delay
          setTimeout(() => {
            submitBtn.classList.remove('loading-pulse');
            submitBtn.style.pointerEvents = 'auto';
            btnText.textContent = 'Sent Successfully';
            
            setTimeout(() => {
               btnText.textContent = 'Submit Inquiry';
               btnIcon.classList.remove('hidden');
               form.reset();
            }, 2000);
          }, 1500);
        }
      });
      
      // Clear error on input
      emailInput.addEventListener('input', () => {
        emailInput.style.borderColor = '';
        emailError.classList.add('opacity-0');
        setTimeout(() => emailError.classList.add('hidden'), 300);
      });
    });
  </script>
</body></html>
